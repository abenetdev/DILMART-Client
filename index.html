<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport ─────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary metadata ─────────────────────────────────────────────── -->
    <title>DilMart — Coming Soon | Ethiopia's Marketplace</title>
    <meta
      name="description"
      content="DilMart is launching soon. Discover products from local Ethiopian sellers, shop with confidence, and experience a better way to buy and sell online."
    />

    <!-- ── Open Graph (Facebook / WhatsApp / LinkedIn previews) ─────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://dilmart.et/" />
    <meta property="og:title"       content="DilMart — Coming Soon | Ethiopia's Marketplace" />
    <meta property="og:description" content="DilMart is launching soon. Shop from verified local sellers with escrow protection, fast delivery, and secure payments." />
    <meta property="og:image"       content="https://dilmart.et/icons/icon-512x512.png" />
    <meta property="og:image:width"  content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name"   content="DilMart" />
    <meta property="og:locale"      content="en_ET" />

    <!-- ── Twitter / X card ─────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="DilMart — Coming Soon | Ethiopia's Marketplace" />
    <meta name="twitter:description" content="DilMart is launching soon. Shop from verified local sellers with escrow protection, fast delivery, and secure payments." />
    <meta name="twitter:image"       content="https://dilmart.et/icons/icon-512x512.png" />

    <!-- ── Canonical URL ────────────────────────────────────────────────── -->
    <link rel="canonical" href="https://dilmart.et/" />

    <!-- ── Favicon ───────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- ── PWA: Web App Manifest ────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── PWA: Theme colour (browser chrome / address bar) ─────────────── -->
    <!-- DilMart brand teal: HSL(176,84%,31%) = #0D9388                      -->
    <meta name="theme-color" content="#0D9388" />

    <!-- ── PWA: iOS / Safari home-screen support ─────────────────────────
         Safari does not use the manifest for home-screen icons; these tags
         provide the equivalent iOS-native hints.
    ──────────────────────────────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DilMart" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- ── PWA: Microsoft Tile (Windows / Edge) ──────────────────────────── -->
    <meta name="msapplication-TileColor" content="#0D9388" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.png" />

    <!-- ── Luxury fonts: Playfair Display (headings) + Inter (body) ─────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
